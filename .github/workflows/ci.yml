name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # The fixed, publicly documented keys of the local Supabase stack. Not secrets:
  # they only ever open the throwaway database this workflow starts.
  NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:55321

jobs:
  # Everything that needs no database: fast feedback on every push.
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Policy: high and critical fail CI; moderate and low are reported in full but do not fail.
      # The first command prints every advisory; the second is the gate (--audit-level hides lower ones).
      - name: Production dependency audit
        run: |
          pnpm audit --prod || true
          pnpm audit --prod --audit-level high

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests with coverage
        run: pnpm test --run --coverage

      - name: Build refuses missing configuration
        run: |
          if NEXT_PUBLIC_SUPABASE_URL= pnpm build > build-without-config.log 2>&1; then
            echo 'The build succeeded without its required configuration.' >&2
            exit 1
          fi
          grep -q 'ShopKhata configuration is not deployable' build-without-config.log

      - name: Build
        env:
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-build-only-placeholder
          SHOPKHATA_ENV: test
        run: pnpm build

      - name: No whitespace errors
        run: git diff --check

  # The full gate against a real local Supabase stack, one suite at a time.
  integration:
    # Isolated disposable daemon/database on this GitHub-hosted VM, never a shared local engine.
    # Sequential lifecycle: start; migration resets; explicit reset; pgTAP writes/rollbacks;
    # integration/rehearsal/perf resets and writes; final browser reset; E2E writes; stop.
    # start/reset/test-db/stop below intentionally need no cross-runner lock. Moving to a
    # self-hosted/shared daemon requires a lock around the ENTIRE lifecycle before setup.
    runs-on: ubuntu-latest
    timeout-minutes: 75
    needs: verify

    steps:
      # Full history: the operations tests read earlier OPS-01B gate files with `git show <sha>:<path>`.
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium firefox webkit

      - name: Start local Supabase
        run: pnpm exec supabase start > /dev/null

      - name: Migration upgrade tests
        run: pnpm test:migration-upgrade

      - name: Reset the complete database
        run: pnpm exec supabase db reset --local

      - name: Database tests (pgTAP)
        run: pnpm exec supabase test db --local

      - name: Database lint
        run: pnpm exec supabase db lint --local --level warning --fail-on error

      - name: Integration - invoice batches
        run: pnpm test:integration:batches

      - name: Integration - payments
        run: pnpm test:integration:payments

      - name: Integration - overpayment
        run: pnpm test:integration:overpayment

      - name: Integration - invoice operations
        run: pnpm test:integration:operations

      - name: Integration - customer ledger and expenses
        run: pnpm test:integration:customer-expenses

      - name: Integration - offline and Excel
        run: pnpm test:integration:offline-excel

      - name: Integration - daily close and reports
        run: pnpm test:integration:closing-reports

      # Administration, the authorization attack matrix, the two-shop requirement, the largest
      # batch, and a financial scenario that must survive a real backup and restore unchanged.
      - name: Production acceptance, including the backup and restore drill
        run: pnpm test:integration:acceptance

      - name: Backup and restore rehearsal of the seeded database
        env:
          SHOPKHATA_BACKUP_DIR: ${{ runner.temp }}/shopkhata-backups
        run: pnpm backup:verify

      - name: Performance sanity at one year of data
        run: pnpm perf:check

      - name: Create local-only application configuration
        run: |
          pnpm exec supabase db reset --local > /dev/null
          supabase_env="$(pnpm exec supabase status -o env 2>/dev/null)"
          API_URL="$(printf '%s\n' "$supabase_env" | sed -n 's/^API_URL=//p' | head -n 1 | tr -d '"')"
          PUBLISHABLE_KEY="$(printf '%s\n' "$supabase_env" | sed -n 's/^PUBLISHABLE_KEY=//p' | head -n 1 | tr -d '"')"
          if [ -z "$PUBLISHABLE_KEY" ]; then
            PUBLISHABLE_KEY="$(printf '%s\n' "$supabase_env" | sed -n 's/^ANON_KEY=//p' | head -n 1 | tr -d '"')"
          fi
          if [ -z "$API_URL" ] || [ -z "$PUBLISHABLE_KEY" ]; then
            echo 'Supabase status did not provide API_URL and a public key.' >&2
            exit 1
          fi
          printf 'NEXT_PUBLIC_SUPABASE_URL=%s\nNEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=%s\n' "$API_URL" "$PUBLISHABLE_KEY" > .env.local

      # Chromium runs every browser test; Firefox and WebKit run the critical-workflow
      # smoke; the PWA project runs against the production build.
      - name: Complete browser suite on all engines
        run: pnpm test:e2e --workers=1

      - name: Keep browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7

      - name: Stop local Supabase
        if: always()
        run: pnpm exec supabase stop
